<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Evaluator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#5f6b7a; --line:#d9dee5;
          --accent:#1f6feb; --gps:#1f77b4; --pred:#d62728; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--text);
         background:var(--bg); display:grid; grid-template-columns:320px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:18px; overflow:auto; }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:var(--muted); margin:0 0 18px; font-size:13px; }
  label { display:block; font-weight:600; margin:14px 0 6px; font-size:13px; }
  input, select, button { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line);
                          border-radius:6px; background:#fff; color:var(--text); }
  button { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; margin-top:10px; }
  button:disabled { opacity:.55; cursor:default; }
  .row { display:flex; gap:8px; } .row button { width:auto; margin-top:0; white-space:nowrap; }
  #status { margin-top:14px; font-size:13px; color:var(--muted); min-height:20px; }
  #status.err { color:var(--bad); }
  .metrics { margin-top:18px; border-top:1px solid var(--line); padding-top:14px; display:none; }
  .metric { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); }
  .metric b { font-variant-numeric:tabular-nums; }
  .big { font-size:28px; font-weight:700; color:var(--accent); }
  .legend { margin-top:18px; font-size:13px; }
  .sw { display:inline-block; width:22px; height:4px; vertical-align:middle; margin-right:8px; border-radius:2px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 14px 0 6px; vertical-align:middle; }
  #map { height:100vh; }
  @media (max-width: 760px) { body { grid-template-columns:1fr; grid-template-rows:auto 60vh; height:auto; }
                              #map { height:60vh; } }
</style>
</head>
<body>
<aside>
  <h1>PathSnap</h1>
  <p class="sub">Map-matching evaluator. The selected trip is processed by the API on laptop 1.</p>

  <label for="api">API address</label>
  <div class="row">
    <input id="api" value="http://localhost:8000" spellcheck="false">
    <button id="connect">Connect</button>
  </div>

  <label for="trip">Trip</label>
  <select id="trip" disabled><option>Connect to load trips</option></select>
  <button id="run" disabled>Run prediction</button>

  <div id="status"></div>

  <div class="metrics" id="metrics">
    <div>Top-1 accuracy</div>
    <div class="big" id="m-acc">–</div>
    <div class="metric"><span>Route continuity</span><b id="m-cont">–</b></div>
    <div class="metric"><span>GPS points</span><b id="m-n">–</b></div>
    <div class="metric"><span>API processing time</span><b id="m-ms">–</b></div>
    <div class="metric"><span>Round trip</span><b id="m-rt">–</b></div>
  </div>

  <div class="legend">
    <div><span class="dot" style="background:var(--gps)"></span>Raw GPS points</div>
    <div style="margin-top:6px"><span class="sw" style="background:var(--pred)"></span>Predicted route</div>
  </div>
</aside>
<div id="map"></div>

<script>
const $ = id => document.getElementById(id);
const map = L.map("map", { preferCanvas: true }).setView([50.0, 8.6], 5);
// Esri basemaps: OpenStreetMap's tile servers refuse pages opened as local files (no Referer),
// and CARTO was unreachable on the campus network.
const esri = name => L.tileLayer(
  `https://server.arcgisonline.com/ArcGIS/rest/services/${name}/MapServer/tile/{z}/{y}/{x}`,
  { maxZoom: 19, attribution: "Tiles &copy; Esri" });
const streets = esri("World_Street_Map").addTo(map), gray = esri("Canvas/World_Light_Gray_Base");
const gpsLayer = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
L.control.layers({ "Streets": streets, "Light gray": gray },
                 { "Raw GPS points": gpsLayer, "Predicted route": routeLayer }, { collapsed: false }).addTo(map);

try { const saved = localStorage.getItem("pathsnap_api"); if (saved) $("api").value = saved; } catch (e) {}
const api = () => $("api").value.trim().replace(/\/+$/, "");

function status(msg, isErr = false) { $("status").textContent = msg; $("status").className = isErr ? "err" : ""; }

$("connect").onclick = async () => {
  status("Connecting…");
  try {
    const r = await fetch(api() + "/trips");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    $("trip").innerHTML = d.trips.map(t => `<option value="${t}">${t}</option>`).join("");
    $("trip").disabled = $("run").disabled = false;
    try { localStorage.setItem("pathsnap_api", api()); } catch (e) {}
    status(`Connected: ${d.trips.length} trips (${d.split}).`);
  } catch (e) {
    status("Could not reach the API at " + api() + ". Check the address, that the API is running with --host 0.0.0.0, and the firewall.", true);
  }
};

$("run").onclick = async () => {
  const trip = $("trip").value;
  $("run").disabled = true; status(`Running trip ${trip}…`);
  const t0 = performance.now();
  try {
    const r = await fetch(api() + "/predict", { method: "POST", headers: { "Content-Type": "application/json" },
                                                body: JSON.stringify({ trip_id: trip }) });
    if (!r.ok) throw new Error((await r.json()).detail || "HTTP " + r.status);
    const d = await r.json();
    draw(d, performance.now() - t0);
    status(`Trip ${trip} done.`);
  } catch (e) {
    status("Prediction failed: " + e.message, true);
  } finally { $("run").disabled = false; }
};

function draw(d, roundTripMs) {
  gpsLayer.clearLayers(); routeLayer.clearLayers();
  d.gps_points.forEach((p, i) => L.circleMarker(p, { radius: 2.5, color: "#1f77b4", weight: 1, fillOpacity: .8 })
                                     .bindTooltip("obs " + i).addTo(gpsLayer));
  L.polyline(d.predicted_route, { color: "#d62728", weight: 4, opacity: .85 }).addTo(routeLayer);
  map.invalidateSize();   // re-measure the container before fitting, or Leaflet can under-zoom
  map.fitBounds(L.latLngBounds(d.gps_points), { padding: [30, 30], animate: false });

  const m = d.metrics, pct = v => (v == null ? "n/a" : (100 * v).toFixed(1) + "%");
  $("m-acc").textContent = pct(m.top1_accuracy);
  $("m-cont").textContent = pct(m.route_continuity);
  $("m-n").textContent = m.n_points.toLocaleString();
  $("m-ms").textContent = d.inference_ms.toFixed(0) + " ms";
  $("m-rt").textContent = roundTripMs.toFixed(0) + " ms";
  $("metrics").style.display = "block";
}
</script>
</body>
</html>
